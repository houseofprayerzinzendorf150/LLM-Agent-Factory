stages:
  - install_requirements
  - test

InstallRequirements:
  stage: install_requirements
  image: python:3.12-slim
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/uv
      - .venv
  before_script:
    - pip install uv
  script:
    - uv sync --all-groups
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

Test:
  stage: test
  image: python:3.12-slim
  needs: [InstallRequirements]
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .venv
    policy: pull
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  before_script:
    - pip install uv
    - export PYTHONPATH="$CI_PROJECT_DIR"
  script:
    - uv run coverage run -m pytest tests/ --junit-xml=report.xml -v
    - uv run coverage xml
    - uv run coverage html
    - uv run coverage report
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
