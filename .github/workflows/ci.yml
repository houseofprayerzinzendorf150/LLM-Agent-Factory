name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source tree
        run: >-
          python -m compileall -q
          retrieval
          script
          experiments
          gmas-main/src/gmas

      - name: Verify gMAS submodule
        run: |
          test -f gmas-main/pyproject.toml
          test -d gmas-main/src/gmas

      - name: Enforce code-only repository boundary
        shell: python
        run: |
          from pathlib import Path

          forbidden = {
              "agents_database",
              "agents_sort_database",
              "task-agents_database",
              "alr-model",
          }
          present = sorted(path for path in forbidden if Path(path).exists())
          if present:
              raise SystemExit(f"External artifact directories must not be committed: {present}")

          oversized = [
              path
              for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.stat().st_size > 10 * 1024 * 1024
          ]
          if oversized:
              raise SystemExit(f"Files larger than 10 MiB must live on Hugging Face: {oversized}")
